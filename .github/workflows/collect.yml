# 채용공고 수집 워크플로 (초안)
# - 지금은 수동 실행(workflow_dispatch)만 가능. 스케줄은 실제 API 클라이언트 구현 후 주석을 풀 것.
# - 결과(data/postings.json)는 아직 저장소·DB 에 반영하지 않고 아티팩트로만 올린다.
# - 서비스키는 저장소 Secrets 의 DATA_GO_KR_KEY 로만 전달한다. 로그에 출력하지 말 것.
name: collect

on:
  workflow_dispatch:
    inputs:
      source:
        description: "데이터 소스 (fixture = 샘플 JSON, live = 실제 API · 아직 미구현)"
        type: choice
        options: [fixture, live]
        default: fixture
      dry_run:
        description: "저장하지 않고 통계만 출력"
        type: boolean
        default: false
  # schedule:
  #   # 매일 06:47, 18:47 KST (UTC 21:47, 09:47). 정각을 피해 지연을 줄인다
  #   - cron: "47 21,9 * * *"

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: 수집
        env:
          # live 일 때만 키를 넘긴다. 키가 없으면 수집기가 안내 메시지와 함께 종료한다
          DATA_GO_KR_KEY: ${{ inputs.source == 'live' && secrets.DATA_GO_KR_KEY || '' }}
          # 입력값은 스크립트에 직접 끼워 넣지 않고 환경변수로 넘긴다(스크립트 인젝션 방지)
          SOURCE: ${{ inputs.source || 'fixture' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$SOURCE" in fixture|live) ;; *) echo "알 수 없는 source"; exit 1 ;; esac
          if [ "$DRY_RUN" = "true" ]; then
            npx tsx scripts/collect.ts --source "$SOURCE" --dry-run
          else
            npx tsx scripts/collect.ts --source "$SOURCE" --out data/postings.json
          fi

      - name: 결과 업로드
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: postings-${{ inputs.source || 'fixture' }}
          path: web/data/postings.json
          if-no-files-found: warn
          retention-days: 7
