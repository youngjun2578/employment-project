<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  HWP 문서가 요구하는 한컴/윈도 글꼴 이름을 서버에 설치된 무료 글꼴로 연결한다.
  필요: fonts-nanum, fonts-noto-cjk. 설치: /etc/fonts/conf.d/ 에 복사 후 fc-cache -f
  고딕 계열 → 나눔고딕 / Noto Sans CJK KR, 명조 계열 → 나눔명조 / Noto Serif CJK KR
  생성 원본 목록은 이 파일 안의 이름들이며, 이름을 추가하면 같은 형식으로 블록을 늘리면 된다.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>굴림</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>굴림체</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Gulim</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>GulimChe</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>돋움</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>돋움체</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Dotum</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>DotumChe</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>고딕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>함초롬돋움</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>HCR Dotum</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>한컴돋움</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>새굴림</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>휴먼고딕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>HY견고딕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>HY중고딕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>바탕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>바탕체</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Batang</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>BatangChe</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>명조</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>궁서</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Gungsuh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>함초롬바탕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>HCR Batang</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>한컴바탕</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>신명조</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>휴먼명조</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>HY신명조</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>HY견명조</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string><string>Noto Serif CJK KR</string></edit>
  </match>
</fontconfig>
